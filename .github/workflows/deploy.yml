name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deployments at once.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Set up SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Copy the app to the VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" dist/ "nwsnotes@$VM_HOST:/opt/nwsnotes/app/"

      - name: Restart the app
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "nwsnotes@$VM_HOST" \
            'cd /opt/nwsnotes/app && pm2 startOrReload ecosystem.config.cjs --update-env && pm2 save'
